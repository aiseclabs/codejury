skip_dirs: [".git", "node_modules", "lib", ".deps", "out", "cache", "forge-cache", "artifacts", "broadcast", "typechain", "typechain-types", "coverage"]

source_extensions: [".sol"]

config_extensions: [".toml", ".json", ".yaml", ".yml"]

manifests: ["foundry.toml", "hardhat.config.js", "hardhat.config.ts", "remappings.txt", "package.json", "truffle-config.js"]

test_dirs: ["test", "tests"]

test_name_patterns: ["*.t.sol", "*.test.sol", "test_*", "*.spec.sol"]

doc_extensions: [".md", ".markdown", ".mdx", ".rst", ".txt", ".adoc"]

lockfiles: ["soldeer.lock", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", "npm-shrinkwrap.json", "bun.lockb", "bun.lock", "deno.lock", "Cargo.lock", "composer.lock"]
