notes: >
  CORS allows any origin together with credentials, so any website can make
  credentialed requests to the authenticated endpoints and read the responses.
code: |
  from fastapi import FastAPI
  from fastapi.middleware.cors import CORSMiddleware

  app = FastAPI()
  app.add_middleware(
      CORSMiddleware,
      allow_origins=["*"],
      allow_credentials=True,
      allow_methods=["*"],
  )

  @app.get("/me")
  async def me():
      return current_user()
