capability: api_design
vulnerable: false
expected_verdict: SECURE
cwe: ""
source: synthetic
notes: >
  Every state-changing admin route carries the same requires_admin gate, so
  there is no unguarded sibling to pivot through.
code: |
  from flask import Blueprint, jsonify
  admin = Blueprint("admin", __name__)

  @admin.route("/admin/users", methods=["GET"])
  @requires_admin
  def list_users():
      return jsonify(load_users())

  @admin.route("/admin/users/<uid>", methods=["DELETE"])
  @requires_admin
  def delete_user(uid):
      delete(uid)
      return "", 204
