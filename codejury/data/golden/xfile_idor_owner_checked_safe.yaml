notes: >
  get_invoice() enforces ownership (owner_id != current_user.id -> Forbidden) and
  the caller passes the authenticated user, so a user can only read their own
  invoice. Safe.
code: |
  def get_invoice(current_user, invoice_id):
      inv = db.invoices.find(invoice_id)
      if inv.owner_id != current_user.id:
          raise Forbidden()
      return inv
