expected_verdict: VULNERABLE
cwe: CWE-639
source: synthetic
notes: >
  get_invoice() looks up by id with no ownership check, and the only caller is an
  authenticated route that also does not check ownership, so any logged-in user
  can read any invoice by changing the id (IDOR). The miss is only visible across
  the two: the route looks safe (login_required), the lookup looks like a plain
  DAO call.
code: |
  def get_invoice(invoice_id):
      return db.invoices.find(invoice_id)
context: |
  # routes.py, the only caller of get_invoice()
  @app.route("/invoice/<invoice_id>")
  @login_required
  def view(invoice_id):
      return get_invoice(invoice_id)
