capability: api_design
vulnerable: true
expected_verdict: VULNERABLE
cwe: CWE-862
source: synthetic
notes: >
  Two sibling admin routes on the same blueprint. The GET is gated with
  requires_admin; the DELETE drops the decorator, so any caller can delete a
  user. The bug is the cross-endpoint inconsistency, not a single line.
code: |
  from flask import Blueprint, jsonify
  admin = Blueprint("admin", __name__)

  @admin.route("/admin/users", methods=["GET"])
  @requires_admin
  def list_users():
      return jsonify(load_users())

  @admin.route("/admin/users/<uid>", methods=["DELETE"])
  def delete_user(uid):
      delete(uid)
      return "", 204
