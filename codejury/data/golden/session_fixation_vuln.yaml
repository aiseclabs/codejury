skill: session
vulnerable: true
expected_verdict: VULNERABLE
cwe: CWE-384
source: synthetic
split: held-out
notes: >
  The pre-authentication session id is reused after a successful login, so an
  attacker who fixed the victim's session id keeps an authenticated session.
  The id must be regenerated on privilege change.
code: |
  def login(request, username, password):
      if check_password(username, password):
          request.session["user"] = username   # same session id as before auth
          return request.session.id
      raise Unauthorized()
