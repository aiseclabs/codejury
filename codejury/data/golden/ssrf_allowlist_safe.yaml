skill: input_validation
vulnerable: false
expected_verdict: SECURE
cwe: ""
source: synthetic
split: held-out
notes: >
  The request URL's host is checked against a fixed allowlist before the fetch,
  so the attacker cannot redirect it to an internal target.
code: |
  ALLOWED_HOSTS = {"api.github.com", "api.stripe.com"}

  def fetch(request):
      url = request.args["url"]
      if urlparse(url).hostname not in ALLOWED_HOSTS:
          raise ValueError("host not allowed")
      return requests.get(url).text
