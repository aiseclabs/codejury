notes: >
  The response reflects the request Origin back into Access-Control-Allow-Origin
  and allows credentials, which is equivalent to a wildcard with credentials: any
  origin is accepted.
code: |
  from flask import Flask, request, make_response
  app = Flask(__name__)

  @app.route("/balance")
  def balance():
      resp = make_response(get_balance())
      resp.headers["Access-Control-Allow-Origin"] = request.headers.get("Origin")
      resp.headers["Access-Control-Allow-Credentials"] = "true"
      return resp
