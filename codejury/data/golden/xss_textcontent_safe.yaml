# Adversarial negative: assigning user input to a DOM property looks like the
# innerHTML XSS, but textContent does not parse HTML.
skill: output_encoding
vulnerable: false
expected_verdict: SECURE
cwe: ""
source: synthetic
notes: >
  textContent sets text, never markup; the browser does not parse the value as
  HTML, so a script payload is rendered as inert text. Contrast the vulnerable
  xss_innerhtml_vuln, which assigns to innerHTML. False positive if flagged.
code: |
  function show(name) {
      el.textContent = name;
  }
