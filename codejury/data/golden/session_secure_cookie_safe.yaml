notes: >
  Session id is regenerated on login and the cookie is set Secure, HttpOnly and
  SameSite=Strict: no fixation, no JS access, no cross-site send.
code: |
  def login(request, response, username, password):
      if not check_password(username, password):
          raise Unauthorized()
      request.session.regenerate_id()           # new id on privilege change
      request.session["user"] = username
      response.set_cookie(
          "sid", request.session.id,
          secure=True, httponly=True, samesite="Strict",
      )
