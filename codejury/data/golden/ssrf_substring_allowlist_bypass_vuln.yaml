# Adversarial positive: an allowlist that looks like a fix but is bypassable.
capability: input_validation
vulnerable: true
expected_verdict: VULNERABLE
cwe: CWE-918
source: synthetic
split: held-out
notes: >
  The check is a substring test on the whole URL, not a parsed-host comparison.
  "http://api.github.com.attacker.com/" and "http://evil/?x=api.github.com" both
  contain the allowed string yet resolve to an attacker host, so the SSRF stands.
  Contrast the genuine fix ssrf_allowlist_safe, which compares urlparse().hostname.
code: |
  def fetch(url):
      if "api.github.com" in url:
          return requests.get(url).text
      raise ValueError("host not allowed")
