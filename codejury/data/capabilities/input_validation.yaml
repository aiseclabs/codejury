id: input_validation
name: Input Validation
asvs_chapter: V5
description: >-
  The inbound trust boundary. Untrusted input must be parameterized, validated
  against an allowlist, or escaped before it reaches an interpreter (SQL, shell,
  filesystem, template, LDAP, ...).

sub_capabilities:
  sql_injection:
    correct_patterns:
      - id: SQLI-OK-1
        description: Use parameterized queries or ORM-bound parameters; never build SQL from input
        signals: ["cursor.execute(", "execute(query, params", "session.query(", "text(:param)"]
        why_ok: The driver sends data separately from the statement, so input cannot alter the query

    anti_patterns:
      - id: SQLI-BAD-1
        cwe: CWE-89
        severity: CRITICAL
        description: Build SQL by string concatenation or f-string interpolation of input
        signals: ['execute(f"', 'execute("SELECT', '" + ', "% (", ".format("]
        why_bad: Input becomes part of the statement and can change its meaning entirely
        example_bad: |
          cursor.execute(f"SELECT * FROM users WHERE name = '{name}'")
        example_good: |
          cursor.execute("SELECT * FROM users WHERE name = %s", (name,))

      - id: SQLI-BAD-2
        cwe: CWE-89
        severity: HIGH
        description: Interpolate a table or column name from input without an allowlist
        why_bad: Identifiers cannot be parameterized, so unchecked input still injects

      - id: SQLI-BAD-3
        cwe: CWE-89
        severity: HIGH
        description: Pass a pre-built SQL string to an ORM raw or text escape hatch
        signals: [".raw(", "text(", "execute_sql("]
        why_bad: Raw escape hatches bypass the ORM's parameter binding

  command_injection:
    correct_patterns:
      - id: CMDI-OK-1
        description: Run subprocesses with an argument list and shell=False
        signals: ["subprocess.run([", "subprocess.Popen(["]
        why_ok: >-
          Arguments are passed directly to execve, so the shell never parses input. This
          only applies to code that actually spawns a process; an ordinary function,
          method, or library/API call (e.g. provider.complete) is not command execution.

    anti_patterns:
      - id: CMDI-BAD-1
        cwe: CWE-78
        severity: CRITICAL
        description: >-
          Pass interpolated input to an OS shell or subprocess: os.system, os.popen,
          subprocess(..., shell=True), or eval/exec. A normal function, method, or
          library/API call is NOT this; flag only an actual shell or process invocation.
        signals: ["os.system(", "shell=True", "os.popen("]
        why_bad: Shell metacharacters in input let an attacker run arbitrary commands
        example_bad: |
          os.system("ping " + host)
        example_good: |
          subprocess.run(["ping", "-c", "1", host], shell=False)

      - id: CMDI-BAD-2
        cwe: CWE-78
        severity: HIGH
        description: Build the argument list itself from an unvalidated, shell-parsed string
        signals: ["shlex.split(", "shell=True"]
        why_bad: Splitting an untrusted string can still smuggle extra arguments or commands

  path_traversal:
    correct_patterns:
      - id: PATH-OK-1
        description: Resolve the path and confirm it stays within an allowed base directory
        signals: ["os.path.realpath", "Path(...).resolve()", "is_relative_to("]
        why_ok: A resolved path outside the base is rejected before any file access

      - id: PATH-OK-2
        description: >-
          Use a path that is not attacker-controlled: a data field, a directory read from
          trusted config, or a path the operator passes on the command line
        why_ok: >-
          Traversal needs an external attacker to control the path. A path stored as a
          field, a trusted/configured directory, or an operator-supplied CLI argument is
          not a finding; neither is merely declaring a `path` attribute.

    anti_patterns:
      - id: PATH-BAD-1
        cwe: CWE-22
        severity: HIGH
        description: >-
          Take an externally controlled value (HTTP request, upload, form, query, or message
          field) and use it in a filesystem open/read/write without resolving it and confirming
          it stays in an allowed base. NOT this: a path kept as a data field, a directory from
          trusted config, or a path the operator passes on the CLI.
        signals: ["request.", "upload", "filename", "os.path.join("]
        why_bad: Sequences like ../ let attacker input escape the intended directory
        example_bad: |
          open(os.path.join(UPLOAD_DIR, request.args["filename"]))
        example_good: |
          target = (UPLOAD_DIR / filename).resolve()
          if not target.is_relative_to(UPLOAD_DIR):
              raise ValueError("path escapes upload dir")

  ssrf:
    correct_patterns:
      - id: SSRF-OK-1
        description: Validate the request URL's host against an allowlist before fetching it
        signals: ["urlparse(", ".hostname", "ALLOWED", "allowlist"]
        why_ok: An attacker cannot redirect the fetch to an internal target the list omits

      - id: SSRF-OK-2
        description: >-
          Fetch a URL that is not attacker-controlled: a constant, a value from trusted
          config, or an operator-supplied argument
        why_ok: >-
          SSRF needs an external attacker to control the destination. A constant URL or one
          from trusted config is not a finding, even though it goes through a fetch call.

    anti_patterns:
      - id: SSRF-BAD-1
        cwe: CWE-918
        severity: HIGH
        description: >-
          Fetch a URL taken from externally controlled input (HTTP request, form, query, or
          message field) without validating its host against an allowlist. NOT this: a
          constant URL, one from trusted config, or an operator-supplied argument.
        signals: ["requests.get(", "urllib.request.urlopen(", "httpx.", "request.args", "request.json"]
        why_bad: >-
          The server makes the request, so attacker input reaches internal-only targets:
          cloud metadata, localhost admin ports, internal APIs behind the firewall.
        example_bad: |
          requests.get(request.args["url"]).text
        example_good: |
          if urlparse(url).hostname not in ALLOWED_HOSTS:
              raise ValueError("host not allowed")
          requests.get(url).text

  insecure_deserialization:
    correct_patterns:
      - id: DESER-OK-1
        description: >-
          Parse untrusted input with a data-only parser, json.loads or yaml.safe_load,
          that cannot instantiate arbitrary objects
        signals: ["json.loads", "yaml.safe_load"]
        why_ok: A data-only parser builds plain structures and has no code-execution path

    anti_patterns:
      - id: DESER-BAD-1
        cwe: CWE-502
        severity: CRITICAL
        description: >-
          Deserialize externally controlled bytes with an object-constructing deserializer:
          pickle, marshal, yaml.load (unsafe Loader), or jsonpickle. NOT this: a data-only
          parser like json.loads or yaml.safe_load.
        signals: ["pickle.loads", "pickle.load(", "yaml.load(", "marshal.loads", "jsonpickle.decode"]
        why_bad: These reconstruct arbitrary objects, so crafted input runs code on unpickle
        example_bad: |
          pickle.loads(base64.b64decode(request.data))
        example_good: |
          json.loads(request.data)

trigger_signals:
  - raw SQL strings or cursor.execute calls appear
  - imports of os, subprocess, or shlex with process execution
  - file paths built from request, form, or query parameters
  - outbound HTTP fetches (requests, urllib, httpx) to a non-constant URL
  - deserialization calls (pickle, yaml.load, marshal) on external input
