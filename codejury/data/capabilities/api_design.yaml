id: api_design
name: API Design
version: "0"
asvs_chapter: V13
description: >
  Architectural consistency across an HTTP API's endpoints, not single-line bugs.
  It judges the surface as a whole: whether sibling routes enforce authorization
  the same way, whether request bodies are bound by an explicit field allowlist,
  whether responses and CORS expose more than intended. Point vulnerabilities stay
  with their own capability (an IDOR is authz, an injection is input_validation);
  api_design fires when an endpoint is inconsistent with its peers or binds and
  exposes data wholesale at the boundary.

sub_capabilities:
  endpoint_authz:
    correct_patterns:
      - id: EPA-OK-1
        description: Every state-changing route enforces the same authorization gate its peers use, or is an explicitly intended public route
        signals: ["@login_required", "@requires_auth", "permission_classes", "Depends(require_user)"]
        why_ok: A uniform gate removes the gap an attacker reaches by picking the one unguarded sibling

    anti_patterns:
      - id: EPA-BAD-1
        cwe: CWE-862
        severity: HIGH
        description: A mutating or privileged route omits the authorization decorator or check that sibling routes on the same surface apply
        why_bad: The inconsistency is the hole; the unguarded endpoint reaches the same actions without the check
        example_bad: |
          @app.route("/admin/users", methods=["GET"])
          @requires_admin
          def list_users(): ...

          @app.route("/admin/users/<id>", methods=["DELETE"])
          def delete_user(id): ...   # sibling drops @requires_admin
        example_good: |
          @app.route("/admin/users/<id>", methods=["DELETE"])
          @requires_admin
          def delete_user(id): ...

  cors:
    correct_patterns:
      - id: CORS-OK-1
        description: Cross-origin access is limited to an explicit origin allowlist, and credentials are not combined with a wildcard origin
        signals: ["allow_origins=[", "CORS_ALLOWED_ORIGINS", "origins=["]
        why_ok: Only named origins can read authenticated responses

    anti_patterns:
      - id: CORS-BAD-1
        cwe: CWE-942
        severity: HIGH
        description: Allow any origin with credentials, or reflect the request Origin into Access-Control-Allow-Origin while allowing credentials
        signals: ["allow_origins=[\"*\"]", "Access-Control-Allow-Origin\", \"*\"", "allow_credentials=True"]
        why_bad: Any site can make credentialed requests and read the authenticated response

  mass_assignment:
    correct_patterns:
      - id: MA-OK-1
        description: Bind only an explicit allowlist of fields from the request body into the model or update
        signals: ["schema.load", "pick(", "only=(", "fields = ["]
        why_ok: Client-controlled fields cannot reach attributes the API did not intend to expose

    anti_patterns:
      - id: MA-BAD-1
        cwe: CWE-915
        severity: HIGH
        description: Spread the whole request body into a model constructor or update, e.g. Model(**request.json) or obj.update(**data)
        signals: ["(**request.json", "(**request.get_json", "update(**data", "setattr(obj"]
        why_bad: A client can set internal fields it was never offered, such as is_admin or balance
        example_bad: |
          user = User(**request.get_json())
        example_good: |
          body = request.get_json()
          user = User(name=body["name"], email=body["email"])

  boundary_validation:
    correct_patterns:
      - id: BV-OK-1
        description: Validate request inputs against a schema or explicit bounds at the API boundary, consistently across endpoints
        signals: ["pydantic", "marshmallow", "request_schema", "validate("]
        why_ok: Malformed or out-of-range input is rejected before it reaches business logic

    anti_patterns:
      - id: BV-BAD-1
        cwe: CWE-20
        severity: MEDIUM
        description: An endpoint consumes client-supplied limits, offsets, or sizes with no bounds while sibling endpoints validate, or accepts the raw body with no schema
        why_bad: Unbounded client input drives resource exhaustion or skips invariants the validated siblings enforce

  response_exposure:
    correct_patterns:
      - id: RE-OK-1
        description: Serialize responses through an explicit field allowlist or response schema
        signals: ["response_model=", "ResponseSchema", "only=(", "serializer"]
        why_ok: New internal fields do not leak into responses by default

    anti_patterns:
      - id: RE-BAD-1
        cwe: CWE-213
        severity: MEDIUM
        description: Return a whole ORM row or internal object to the client, e.g. jsonify(user.__dict__) or returning the model directly, exposing fields like password_hash
        signals: ["jsonify(user.__dict__", "return user.__dict__", "to_dict()", "model_dump()"]
        why_bad: Internal and sensitive fields ship to the client whenever the model grows

trigger_signals:
  - more than one HTTP route on the same app or router
  - authorization decorators present on some routes but not others
  - request bodies bound directly into models
  - responses built from whole ORM objects
