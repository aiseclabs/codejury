id: sqli
name: SQL Injection
cwe: [CWE-89]
# The marker lands in the query string. A parameterized call keeps the marker in
# the params tuple (the second argument), not the query, so first_str_arg only
# matches when the input was concatenated into the statement itself.
payload: "1' OR 'CJPOCMARK'='CJPOCMARK"
marker: CJPOCMARK
match: first_str_arg
method_sinks:
  - {method: execute}
  - {method: executescript}
  - {method: executemany}
  - {method: raw}
