id: cmdi
name: Command Injection
cwe: [CWE-78]
# A unique marker carried inside a shell-metacharacter payload. If it reaches a
# shell-executing sink as a string, the input provably controls the command.
payload: "; CJPOCMARK -rf /"
marker: CJPOCMARK
sinks:
  - {call: "os.system"}
  - {call: "os.popen"}
  - {call: "subprocess.run", requires_kwarg: {shell: true}}
  - {call: "subprocess.Popen", requires_kwarg: {shell: true}}
  - {call: "subprocess.call", requires_kwarg: {shell: true}}
  - {call: "subprocess.check_output", requires_kwarg: {shell: true}}
