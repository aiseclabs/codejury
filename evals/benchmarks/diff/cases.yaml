# The shipped diff probe cases. Each is a small realistic patch, synthetic and authored
# here, not third-party, so it ships publicly. A positive carries a category and should
# yield a finding, a safe case carries none and must stay clean. Every row names the
# knowledge it exercises so the coverage matrix attributes it, a safe lookalike included,
# it guards the class it is named under. The aim is at least one positive and one safe case
# per vulnerability class, so the probe measures both recall and the false positive guard.
#
# Knowledge is the vulnerability class always, plus a framework guide only where the patch
# uses a framework-specific api. A bare language guide is left to the repo benchmarks, a
# three-line snippet does not meaningfully exercise a language review guide.

cases:
  # injection, positives
  - name: sqli
    category: sql-injection
    knowledge:
      vulnerabilities: [sql-injection]
    tags: [injection, python, smoke]
    diff: |
      diff --git a/app.py b/app.py
      --- a/app.py
      +++ b/app.py
      @@ -10,3 +10,4 @@ def get_user(name):
      -    return None
      +    q = "SELECT * FROM users WHERE name = '" + name + "'"
      +    return db.execute(q).fetchone()

  - name: cmdi
