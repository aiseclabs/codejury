      --- a/Pool.sol
      +++ b/Pool.sol
      @@ -27,2 +27,4 @@ contract Pool {
      -    function feeOn(uint256 amount) public view returns (uint256) {
      -    }
      +    function feeOn(uint256 amount) public view returns (uint256) {
      +        return amount * feeBps / 10000;
      +    }

