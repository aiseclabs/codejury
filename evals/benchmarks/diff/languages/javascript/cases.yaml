    tags: [injection, javascript, safe]
    diff: |
      diff --git a/routes.js b/routes.js
      --- a/routes.js
      +++ b/routes.js
      @@ -8,2 +8,3 @@ app.get('/u', (req, res) => {
      -  res.end()
      +  db.query("SELECT * FROM users WHERE id = ?", [req.query.id], (e, r) => res.json(r))
