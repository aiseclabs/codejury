# Answer key for the INSATutorat real-repo target. This is real third-party code at a real
# vulnerable commit, not authored here, see benchmark.yaml for the clone pointer. The review
# under test never reads this file.
#
# Checked out at commit 99e9db7, the parent of fix 15ae474. The planted issue was confirmed
# by reading the real code at this commit, not from the advisory text alone. It is a public
# GHSA, so this target carries a leakage caveat and measures regression more than true
# recall, the unseen private targets carry the real signal. This is a single-finding recall
# probe, can the review catch that the shared admin middleware never stops a non-admin, so an
# authenticated user reaches the whole admin surface. The user-gated routes are the precision
# guard. A report that matches neither a planted issue nor a safe sibling is listed as extra,
# it may be another real bug this one does not cover.

target: insatutorat

planted:
  - id: admin-middleware-no-abort
    category: missing-authorization
    entry: GET /admin/users
    file: middlewares/admin.go
    severity: HIGH
    note: GHSA-xfx2-prg5-jq3g. AdminHandler returns from each failure branch without calling
          c.Abort, and in Gin a middleware that returns without aborting still runs the next
          handler. In main.go the /admin group is wired with userMiddleware then
          adminMiddleware, so an authenticated non-admin passes UserHandler, reaches the
          not user.IsAdmin branch in AdminHandler, which returns without aborting, and Gin
          proceeds to the admin handler. The admin handlers carry no role check of their own,
          GetUsers returns every user's private details and DeleteTutorAssignment deletes
          assignment records by id, so any logged-in user reaches the full admin surface. The
          root cause is the one missing c.Abort in middlewares/admin.go, so every /admin route
          shares the flaw and any of them, such as GET /admin/users or DELETE
          /admin/campaign/<campaignId>/assignments/tutor, demonstrates it. Confirmed at commit
          99e9db7, the three failure branches lack c.Abort. The fix 15ae474 adds one c.Abort
          per branch and changes nothing else.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/go
        - frameworks/go/gin

safe:
  - id: safe-user-middleware-aborts
    category: missing-authorization
    entry: GET /assignments/tutor
    file: middlewares/user.go
    note: The /assignments, /campaign, and /tutoring groups are gated by UserHandler, which
          calls c.Status then c.Abort in both failure branches before returning, so it
          correctly stops an unauthenticated request. It is the direct contrast to the
          unaborted AdminHandler, reporting a user-gated route as missing authorization is a
          false positive.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/go
        - frameworks/go/gin

  - id: safe-tutee-assignments-scoped
    category: insecure-direct-object-reference
    entry: GET /assignments/tutee
    file: routes/assignments/get_tutee_assignments.go
    note: TuteeAssignments reads the caller with c.MustGet("user") and scopes the query with
          Where tutee_id equals the caller's ID, so it never trusts a client-supplied id for
          ownership. Reporting it as an IDOR is a false positive.
    knowledge:
      vulnerabilities:
        - insecure-direct-object-reference
      guides:
        - languages/go
        - frameworks/go/gin
