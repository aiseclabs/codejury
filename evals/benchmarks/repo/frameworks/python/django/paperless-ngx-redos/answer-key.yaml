# Answer key for the paperless-ngx ReDoS target. Real third-party code at a real vulnerable
# release, not authored here, see benchmark.yaml for the clone pointer. The review under test
# never reads this file.
#
# Checked out at tag v2.20.1, the last release before the 2.20.2 fix, review scope src/documents.
# Confirmed by reading the real code at this tag, src/documents/regex.py does not exist yet and
# matches runs the user regex with no timeout. Public advisory GHSA-24x5-wp64-9fcc, so this
# target measures regression more than true recall. It plants one catastrophic-backtracking
# ReDoS, a user-supplied pattern run against full document content. The correctly bounded
# sibling, the fnmatch based workflow matcher, is the precision guard. This tag also still
# carries the two IDOR flaws the paperless-ngx target covers, a report of those is a real bug
# here, this key does not score it.

target: paperless-ngx-redos

planted:
  - id: regex-match-unbounded-backtracking
    category: resource-exhaustion
    file: src/documents/matching.py
    severity: HIGH
    symbols:
      - matches
    note: >-
      GHSA-24x5-wp64-9fcc. In the MATCH_REGEX branch, matches compiles and runs
      matching_model.match, a user-controlled pattern settable through the Tag, Correspondent,
      DocumentType, and WorkflowTrigger API, against the full document content with no timeout
      and no safe-regex engine. The serializer validate_match only checks re.compile for syntax,
      so a low-privilege user stores a catastrophic pattern such as (a+)+$ and every matched
      document pins a CPU core, starving the Celery workers. The except clause catches only
      re.error, not runaway backtracking.
    knowledge:
      vulnerabilities:
        - resource-exhaustion
      guides:
        - languages/python
        - frameworks/python/django

safe:
  - id: safe-workflow-fnmatch-filename
    category: resource-exhaustion
    file: src/documents/matching.py
    symbols:
      - consumable_document_matches_workflow
    note: >-
      consumable_document_matches_workflow matches filename and path filters with fnmatch, a
      linear-time glob translation, not an arbitrary user regex against full content. It is the
      bounded sibling of the regex matcher, a report of resource exhaustion here is a false
      positive.
    knowledge:
      vulnerabilities:
        - resource-exhaustion
      guides:
        - languages/python
        - frameworks/python/django
