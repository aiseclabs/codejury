# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. django-filer is the widely
# used file and image management application for Django, this is its real code at a real vulnerable
# commit, not authored here. Real third-party code is never copied in, this repo ships to GitHub
# and PyPI.
id: django-filer
kind: repo

target:
  type: git
  url: https://github.com/django-cms/django-filer
  # the vulnerable commit, the parent of fix f8209a6 which adds a default deny for
  # application/octet-stream so unknown or binary uploads are rejected
  ref: d72520c329beb40788f0c9a6b685af8bc591581e
  # review scope: the filer package, which owns the upload validation and the admin upload views
  path: filer

stack:
  languages:
    - python
  frameworks:
    - django
  protocols: []

knowledge:
  vulnerabilities:
    - unrestricted-file-upload
  guides:
    - languages/python
    - frameworks/python/django

tags:
  - public
  - unrestricted-file-upload
  - django
