# A real-world repo target, not vendored. The review runs against a clone, so this stores
# only the pointer plus the stack and knowledge this benchmark exercises. Paperless-ngx is a
# real, widely deployed Django and DRF document management system, this is its real code at a
# real vulnerable version, not authored here. Real third-party code is never copied in, this
# repo ships to GitHub and PyPI.
id: paperless-ngx
kind: repo

target:
  type: git
  url: https://github.com/paperless-ngx/paperless-ngx
  # v2.20.6 is the last release that carries both planted issues. The storage path test
  # endpoint is fixed in 2.20.7, the global search mail leak in 2.20.12.
  ref: v2.20.6
  # review scope: the documents app, which owns the views, serializers, permissions, and the
  # filename templating that the access-control flaws span
  path: src/documents

stack:
  languages:
    - python
  frameworks:
    - django
  protocols: []

knowledge:
  vulnerabilities:
    - insecure-direct-object-reference
    - missing-authorization
    - server-side-template-injection
  guides:
    - languages/python
    - frameworks/python/django

tags:
  - public
  - authz
  - django
