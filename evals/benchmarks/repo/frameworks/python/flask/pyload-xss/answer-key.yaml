# Answer key for the pyLoad stored-XSS target. Real third-party code at a real vulnerable commit,
# not authored here, see benchmark.yaml for the clone pointer. The review under test never reads
# this file.
#
# Checked out at 3eeecf5, the parent of the 46d75a3 fix, review scope src/pyload/webui/app.
# Confirmed by reading the shipped JS templates at this commit. Public advisory CVE-2023-0488,
# GHSA-wcm6-wv95-7jw6, so this target measures regression more than true recall. It plants one
# stored XSS, the package and link fields render into the DOM through jQuery .html() with no
# escaping. The dashboard renderer, which uses .text() for the same fields, is the precision
# guard.

target: pyload-xss

planted:
  - id: packages-html-stored-xss
    category: cross-site-scripting
    file: src/pyload/webui/app/themes/modern/templates/js/packages.js
    severity: MEDIUM
    note: >-
      CVE-2023-0488. The package render loop builds an HTML string by concatenating link.url and
      link.name raw, "<a href='" + link.url + "'>" + link.name + "</a>", then injects it with
      $(div).html(html). The link name and url come from a stored package created through the
      add_package and the unauthenticated CNL addcrypted2 handlers, so a package named like
      <img src=x onerror=alert(document.cookie)> executes when any operator views the collector.
      The fix only makes the link unclickable, the correct remediation is .text() or HTML
      encoding.
    knowledge:
      vulnerabilities:
        - cross-site-scripting
      guides:
        - languages/javascript

safe:
  - id: safe-dashboard-text-render
    category: cross-site-scripting
    file: src/pyload/webui/app/themes/modern/templates/js/dashboard.js
    note: >-
      The dashboard renderer writes the same untrusted fields with jQuery .text(), for example
      $(this.elements.name).text(item.name), which escapes the content. It is the safely rendered
      sibling of the packages loop, a report of XSS here is a false positive.
    knowledge:
      vulnerabilities:
        - cross-site-scripting
      guides:
        - languages/javascript
