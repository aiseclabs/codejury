# Answer key for the Superset deserialization target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test
# never reads this file.
#
# Checked out at 10d640e9, the parent of the f1fa1a7 fix, review scope superset/key_value.
# Confirmed by reading commands/get.py and commands/create.py at this commit, the JsonKeyValueCodec
# the fix introduces does not exist yet. Public advisory CVE-2023-37941, GHSA-fj4x-m62j-wvwg, so
# this target measures regression more than true recall. It plants one insecure deserialization,
# the key-value store reads its entries back with pickle.loads, reached through the permalink REST
# endpoints. The malicious bytes enter the shared key_value table via a metadata-DB write such as
# SQLLab, so the taint precondition is a DB write, the deserialization itself fires on an HTTP GET.

target: superset

planted:
  - id: key-value-pickle-loads
    category: insecure-deserialization
    file: superset/key_value/commands/get.py
    severity: HIGH
    symbols:
      - GetKeyValueCommand
      - get
    note: >-
      CVE-2023-37941. GetKeyValueCommand.get returns pickle.loads(entry.value) over a row read
      from the key_value table, and CreateKeyValueCommand stores value=pickle.dumps(self.value),
      so the store round-trips through pickle with no codec guard. The value is reached on an HTTP
      GET through GetExplorePermalinkCommand and the dashboard permalink REST endpoints, so a
      crafted entry yields code execution through pickle on read. The fix replaces this with a
      JsonKeyValueCodec.
    knowledge:
      vulnerabilities:
        - insecure-deserialization
      guides:
        - languages/python
        - frameworks/python/flask
