# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Superset is a real, widely
# deployed Apache analytics and BI platform on Flask and Flask-AppBuilder, this is its real code
# at a real vulnerable commit, not authored here. Real third-party code is never copied in, this
# repo ships to GitHub and PyPI.
id: superset
kind: repo

target:
  type: git
  url: https://github.com/apache/superset
  # the vulnerable commit, the parent of fix f1fa1a7 which added a JsonKeyValueCodec
  ref: 10d640e940cdbf76129e5cb7c608df47ef88e06b
  # review scope: the key-value store, where the pickle sink and its producer live
  path: superset/key_value

stack:
  languages:
    - python
  frameworks:
    - flask
  protocols: []

knowledge:
  vulnerabilities:
    - insecure-deserialization
  guides:
    - languages/python
    - frameworks/python/flask

tags:
  - public
  - deserialization
  - flask
