# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. changedetection.io is a real,
# widely used open-source website-change monitor on Flask, this is its real code at a real
# vulnerable commit, not authored here. Real third-party code is never copied in, this repo ships
# to GitHub and PyPI.
id: changedetection.io
kind: repo

target:
  type: git
  url: https://github.com/dgtlmoon/changedetection.io
  # the vulnerable commit, the parent of fix 52b189f which hardened the XML parser against XXE
  ref: 866b442576085de3eda7497685394060f4550fdf
  # review scope: the HTML and XML tooling, where the XPath filters build the parser
  path: changedetectionio

stack:
  languages:
    - python
  frameworks:
    - flask
  protocols: []

knowledge:
  vulnerabilities:
    - xml-external-entity
  guides:
    - languages/python
    - frameworks/python/flask

tags:
  - public
  - xxe
  - flask
