# Answer key for the changedetection.io XXE target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test never
# reads this file.
#
# Checked out at 866b442, the parent of the 52b189f fix, review scope changedetectionio. Confirmed
# by reading html_tools.py at this commit, the parser has no resolve_entities or no_network guard.
# Public advisory CVE-2026-41895, GHSA-v7cp-2cx9-x793, so this target measures regression more
# than true recall. It plants one XXE, an lxml XML parser built without disabling external
# entities, fed the fetched content of a monitored URL.

target: changedetection.io

planted:
  - id: xpath-filter-lxml-xxe
    category: xml-external-entity
    file: changedetectionio/html_tools.py
    severity: HIGH
    symbols:
      - xpath_filter
      - xpath1_filter
    note: >-
      CVE-2026-41895. xpath_filter and xpath1_filter build parser =
      etree.XMLParser(strip_cdata=False) and call etree.fromstring(content, parser=parser) without
      resolve_entities=False, load_dtd, or no_network, so lxml resolves external entities by
      default. apply_include_filters in the text_json_diff processor calls xpath_filter on the
      fetched body of a monitored URL when the content is XML or RSS, so a monitored server
      returning XML with a SYSTEM entity leaks local files into the watch output and notifications.
      The fix adds resolve_entities=False and no_network=True to both parsers.
    knowledge:
      vulnerabilities:
        - xml-external-entity
      guides:
        - languages/python
        - frameworks/python/flask
