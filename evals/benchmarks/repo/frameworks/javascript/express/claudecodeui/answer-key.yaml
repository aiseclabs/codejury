# Answer key for the Claude Code UI command-injection target. Real third-party code at a real
# vulnerable commit, not authored here, see benchmark.yaml for the clone pointer. The review under
# test never reads this file.
#
# Checked out at cb4fd79, the parent of the fix 86c33c1, review scope server. Confirmed by reading
# server/routes/git.js at this commit. Public advisory CVE-2026-31862, GHSA-f2fc-vc88-6w7q, so this
# target measures regression more than true recall. It plants one command-injection flaw, a branch
# name from the request body interpolated into a shell command.

target: claudecodeui

planted:
  - id: git-branch-shell-injection
    category: command-injection
    file: server/routes/git.js
    severity: CRITICAL
    symbols:
      - checkout
      - create-branch
    note: >-
      CVE-2026-31862. The git routes read branch and other fields straight from req.body and
      interpolate them into a shell string passed to execAsync, the promisified child_process.exec,
      which runs through /bin/sh. The POST /checkout handler runs git checkout "${branch}" and
      POST /create-branch runs git checkout -b "${branch}", so a value such as main"; id #
      escapes the quotes and runs an arbitrary command on the host. Sibling handlers /commit and
      the diff routes interpolate file and message the same way. The fix replaces the shell strings
      with argument-array spawns and validates the inputs.
    knowledge:
      vulnerabilities:
        - command-injection
      guides:
        - languages/javascript
        - frameworks/javascript/express
