# Answer key for the Ray command-injection target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test
# never reads this file.
#
# Checked out at 79a5643, the parent of the 193ff8c fix, review scope
# python/ray/dashboard/modules/reporter. Confirmed by reading profile_manager.py and
# reporter_head.py at this commit. Public advisory CVE-2023-6019, GHSA-h3xg-wv58-5p43, so this
# target measures regression more than true recall. It plants one command injection, a dashboard
# route passes an unauthenticated query parameter into a shell command. There is no safe sibling
# at this commit, all three subprocess calls in the file use shell=True, the fix is the argv-exec
# plus allowlist form.

target: ray

planted:
  - id: cpu-profile-format-shell-injection
    category: command-injection
    entry: GET /worker/cpu_profile
    file: python/ray/dashboard/modules/reporter/profile_manager.py
    severity: CRITICAL
    symbols:
      - cpu_profile
    note: >-
      CVE-2023-6019. The dashboard route /worker/cpu_profile reads format = req.query.get("format",
      "flamegraph") and passes it down to CpuProfilingManager.cpu_profile, which builds
      cmd = f"py-spy record ... -f {format}" and runs await asyncio.create_subprocess_shell(cmd,
      shell=True). The format value is interpolated raw with no allowlist, so a query such as
      format=flamegraph;touch+/tmp/pwned injects arbitrary shell on the unauthenticated dashboard.
      The fix switches to create_subprocess_exec with an argv list and an allowlist.
    knowledge:
      vulnerabilities:
        - command-injection
      guides:
        - languages/python
