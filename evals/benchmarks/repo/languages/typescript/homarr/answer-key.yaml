# Answer key for the Homarr race-condition target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test never
# reads this file.
#
# Checked out at 4fb48c2, the parent of the 1938798 fix, review scope packages/api/src/router.
# Confirmed by reading user.ts at this commit. Public advisory CVE-2026-32602, GHSA-vfw3-53q9-2hp8,
# so this target measures regression more than true recall. It plants one TOCTOU race, a
# single-use invite checked, then consumed, in separate non-atomic queries.

target: homarr

planted:
  - id: register-invite-toctou
    category: race-condition
    entry: POST /api/trpc/user.register
    file: packages/api/src/router/user.ts
    severity: MEDIUM
    symbols:
      - register
    note: >-
      CVE-2026-32602. The public register mutation reads the single-use invite with
      invites.findFirst, throws if missing or expired, then createUserAsync, then deletes the
      invite, three separate non-atomic queries. Concurrent requests with the same invite token
      all pass the findFirst check before any delete runs, so one invite mints multiple accounts,
      a check-then-act TOCTOU. The fix wraps the insert and delete in a transaction and rejects
      when the delete affects zero rows.
    knowledge:
      vulnerabilities:
        - race-condition
      guides:
        - languages/typescript

safe:
  - id: safe-admin-create-gated
    category: race-condition
    file: packages/api/src/router/user.ts
    symbols:
      - create
    note: >-
      The admin create procedure runs behind permissionRequiredProcedure with the admin
      permission and does not redeem a single-use invite, so it is not the race. Flagging it as a
      TOCTOU is a false positive, only the public register path is the bug.
    knowledge:
      vulnerabilities:
        - race-condition
      guides:
        - languages/typescript
