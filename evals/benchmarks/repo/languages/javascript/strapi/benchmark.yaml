# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Strapi is a real, widely
# used open-source headless CMS, this is its real code at a real vulnerable commit, not authored
# here. Real third-party code is never copied in, this repo ships to GitHub and PyPI.
id: strapi
kind: repo

target:
  type: git
  url: https://github.com/strapi/strapi
  # the vulnerable commit, the parent of fix 46f8f98 which verifies the Cognito token signature
  ref: 16fb8dfe0c3fdcf995a05e0886f51b7b77dfd3eb
  # review scope: the users-permissions auth providers, where the JWT is decoded
  path: packages/plugins/users-permissions/server

stack:
  languages:
    - javascript
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - jwt-validation
  guides:
    - languages/javascript

tags:
  - public
  - jwt
  - javascript
