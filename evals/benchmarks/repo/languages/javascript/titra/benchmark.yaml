# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Titra is a real open-source
# time-tracking app on Meteor, this is its real code at a real vulnerable commit, not authored
# here. Real third-party code is never copied in, this repo ships to GitHub and PyPI.
id: titra
kind: repo

target:
  type: git
  url: https://github.com/titraio/titra
  # the vulnerable commit, the parent of fix 29e6b88 which reorders the spread so protected
  # fields win
  ref: 2e2ac5cbeed47a76720b21c7fde0214a242e065e
  # review scope: the timecards server methods and the API routes that feed them
  path: imports/api/timecards/server

stack:
  languages:
    - javascript
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - mass-assignment
  guides:
    - languages/javascript

tags:
  - public
  - mass-assignment
  - javascript
