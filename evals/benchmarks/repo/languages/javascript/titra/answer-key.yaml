# Answer key for the titra mass-assignment target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test never
# reads this file.
#
# Checked out at 2e2ac5c, the parent of the 29e6b88 fix, review scope
# imports/api/timecards/server. Confirmed by reading methods.js at this commit. Public advisory
# CVE-2026-21695, GHSA-gc65-vr47-jppq, so this target measures regression more than true recall.
# It plants one mass assignment, a spread of the request customfields over the protected fields.

target: titra

planted:
  - id: insert-timecard-customfields-override
    category: mass-assignment
    entry: POST /timeentry/create/
    file: imports/api/timecards/server/methods.js
    severity: MEDIUM
    symbols:
      - insertTimeCard
    note: >-
      CVE-2026-21695. insertTimeCard builds newTimeCard with the protected fields userId,
      projectId, date, hours, task and then spreads ...customfields after them, so a
      caller-supplied customfields object overrides those fields. The API route /timeentry/create
      passes json.customfields straight from the request body into insertTimeCard, so an
      authenticated user sets state to billed, reassigns userId, or overwrites hours. The fix
      reorders the spread to put ...customfields first so the protected fields win.
    knowledge:
      vulnerabilities:
        - mass-assignment
      guides:
        - languages/javascript
