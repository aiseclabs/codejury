# A real-world repo target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. ZITADEL is a real, widely
# used open-source identity platform, this is its real code at a real vulnerable commit, not
# authored here. Real third-party code is never copied in, this repo ships to GitHub and PyPI.
id: zitadel
kind: repo

target:
  type: git
  url: https://github.com/zitadel/zitadel
  # the vulnerable commit, the parent of fix b1e60e7 which adds intent consume and expiry
  ref: bb56b362a755b5e07dfd364db59e1c02cd21690e
  # review scope: the command layer, where the session and idp intent checks live
  path: internal/command

stack:
  languages:
    - go
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - replay-attack
  guides:
    - languages/go

tags:
  - public
  - replay
  - go
