# A real-world repo target, not vendored. The review runs against a clone, so this stores
# only the pointer plus the stack and knowledge this benchmark exercises. Weblate is a real,
# widely deployed Django and DRF localization platform, this is its real code at a real
# vulnerable version, not authored here. Real third-party code is never copied in, this repo
# ships to GitHub and PyPI.
id: weblate
kind: repo

target:
  type: git
  url: https://github.com/WeblateOrg/weblate
  ref: weblate-5.16
  # review scope: the REST API surface, the views and serializers that own access control
  path: weblate/api

stack:
  languages:
    - python
  frameworks:
    - django
  protocols: []

knowledge:
  vulnerabilities:
    - mass-assignment
    - missing-authorization
  guides:
    - languages/python
    - frameworks/python/django

tags:
  - public
  - authz
  - django
