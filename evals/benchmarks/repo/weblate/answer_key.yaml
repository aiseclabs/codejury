# Answer key for the Weblate real-repo target. This is real third-party code at a real
# vulnerable version, not authored here, see benchmark.yaml for the clone pointer. The
# review under test never reads this file.
#
# Cloned at weblate-5.16, review scope weblate/api, the REST API access-control surface.
# Both planted issues were confirmed by reading the real code at this tag, not from the
# advisory text alone. Each is a public CVE, so this target carries a leakage caveat and
# measures regression more than true recall, the unseen private targets carry the real
# signal. A report that matches neither a planted issue nor a safe sibling is listed as
# extra, it may be another real bug these few do not cover. Each entry names the knowledge
# it exercises so the coverage matrix can attribute it.

target: weblate

planted:
  - id: user-mass-assignment-privesc
    category: mass-assignment
    entry: PATCH /api/users/<username>/
    file: weblate/api/serializers.py
    severity: HIGH
    note: CVE-2026-34393. FullUserSerializer lists is_superuser, is_active, is_bot, and
          date_expires as writable fields, read_only_fields holds only id, date_joined, and
          last_login, and UserViewSet.update calls perm_check with allow_self=True. So a user
          who holds user.view but not user.edit, editing their own record, is served the
          FullUserSerializer and can PATCH is_superuser to true and escalate. The flaw spans
          the serializer field list and the view's self-edit allowance, it is not visible
          from either file alone.
    knowledge:
      vulnerabilities:
        - mass-assignment
      guides:
        - languages/python
        - frameworks/python/django

  - id: addon-read-missing-authz
    category: missing-authorization
    entry: GET /api/addons/
    file: weblate/api/views.py
    severity: MEDIUM
    note: CVE-2026-27457. AddonViewSet sets queryset = Addon.objects.all() and calls
          perm_check only in update and destroy, never in list or retrieve, and defines no
          get_queryset scoping. So any authenticated user reads every add-on configuration
          across all projects regardless of access. The write path is gated, only the read
          path is unscoped, so the gap is visible only by noticing the missing read check.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/python
        - frameworks/python/django

safe:
  - id: safe-user-list-scoped
    category: missing-authorization
    entry: GET /api/users/
    file: weblate/api/views.py
    note: UserViewSet.list filters the queryset by the caller's user.view and user.edit
          permissions and falls back to the caller's own record, so the user listing is
          correctly scoped, the correct sibling of the addon read gap, reporting it is a
          false positive.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/python
        - frameworks/python/django

  - id: safe-addon-write-gated
    category: missing-authorization
    entry: PUT /api/addons/<id>/
    file: weblate/api/views.py
    note: AddonViewSet.update and destroy both call perm_check, which requires
          component.edit or project.edit on the add-on's component or project, so the add-on
          write path is correctly authorized, reporting it as missing authorization is a
          false positive. Only the read path is the bug.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/python
        - frameworks/python/django
