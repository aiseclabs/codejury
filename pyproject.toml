[project]
name = "codejury"
version = "1.4.3"
description = "AI-assisted security review for code diffs and whole repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AISecLabs" }]
keywords = ["security", "appsec", "static analysis", "llm", "owasp", "asvs", "code review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "json-repair>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.0"]
all = ["anthropic>=0.40", "openai>=1.0", "litellm>=1.0"]
# the evm facts and PoC backends, heavy and lazy-imported, so they stay out of a base install
evm = ["slither-analyzer>=0.10", "web3>=6.0"]
# the persistent subscription transport, lazy-imported so the base install stays keyless and light
claude-sdk = ["claude-agent-sdk>=0.2"]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[project.scripts]
codejury = "codejury.cli:main"

[project.urls]
Homepage = "https://github.com/aiseclabs/codejury"
Repository = "https://github.com/aiseclabs/codejury"
Issues = "https://github.com/aiseclabs/codejury/issues"
Changelog = "https://github.com/aiseclabs/codejury/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codejury*"]

[tool.setuptools.package-data]
codejury = ["domains/*/knowledge/**/*.md", "domains/*/playbook/**/*.md", "domains/*/detection.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
